<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiet Issue - Jolliebee</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/dashboard" class="navbar-brand">Jolliebee</a>
            <ul class="navbar-menu">
                <li><a href="/dashboard" class="navbar-link">Dashboard</a></li>
                <li><a href="/projects" class="navbar-link">Du an</a></li>
                <li><a href="/issues" class="navbar-link active">Issues</a></li>
                <li><a href="/profile" class="navbar-link">Ho so</a></li>
            </ul>
            <div class="navbar-user">
                <div class="user-avatar" id="userAvatar">A</div>
                <button class="btn btn-outline btn-small" onclick="AuthService.logout()">Dang xuat</button>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="container page-shell">
            <a href="/issues" class="btn btn-outline btn-small">Quay lai issues</a>

            <section class="page-panel">
                <div class="section-header">
                    <div>
                        <div class="hero-badge">Chi tiet issue</div>
                        <h1 class="section-title" id="issueTitle">Tieu de issue</h1>
                        <p class="section-subtitle" id="issueDescription">Mo ta issue</p>
                    </div>
                    <div class="section-actions">
                        <button class="btn btn-secondary" onclick="window.history.back()">Quay lai</button>
                        <button class="btn btn-outline" onclick="editIssue()">Chinh sua</button>
                    </div>
                </div>
                <div class="info-grid" id="issueInfo"></div>
            </section>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        const user = AuthService.getCurrentUser();
        if (user) {
            document.getElementById('userAvatar').textContent = (user.displayName || user.username).charAt(0).toUpperCase();
        }

        const issueId = window.location.pathname.split('/')[2];

        async function loadIssueDetail() {
            try {
                UIUtils.showLoading();
                const issue = await IssueService.getById(issueId);
                UIUtils.hideLoading();

                document.getElementById('issueTitle').textContent = issue.title;
                document.getElementById('issueDescription').textContent = issue.description || 'Khong co mo ta';

                document.getElementById('issueInfo').innerHTML = `
                    <div class="info-item">
                        <span class="meta-label">Do uu tien</span>
                        <div class="info-value"><span class="badge badge-primary">${issue.priority || 'Medium'}</span></div>
                    </div>
                    <div class="info-item">
                        <span class="meta-label">Trang thai</span>
                        <div class="info-value"><span class="badge badge-info">${issue.status || 'Open'}</span></div>
                    </div>
                    <div class="info-item">
                        <span class="meta-label">Ngay tao</span>
                        <div class="info-value">${UIUtils.formatDate(issue.createdAt || new Date())}</div>
                    </div>
                `;
            } catch (error) {
                UIUtils.hideLoading();
                UIUtils.showError('Loi khi tai chi tiet issue');
                console.error('Error:', error);
            }
        }

        function editIssue() {
            window.location.href = '/issues';
        }

        loadIssueDetail();
    </script>
</body>
</html>
