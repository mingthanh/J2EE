<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinh Sua Du An - Jolliebee</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body data-title-key="project_edit_title">
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/dashboard" class="navbar-brand">Jolliebee</a>
            <ul class="navbar-menu">
                <li><a href="/dashboard" class="navbar-link" data-i18n="nav_dashboard">Dashboard</a></li>
                <li><a href="/projects" class="navbar-link active" data-i18n="nav_projects">Dự án</a></li>
                <li><a href="/issues" class="navbar-link" data-i18n="nav_issues">Công việc</a></li>
                <li><a href="/profile" class="navbar-link" data-i18n="nav_profile">Hồ sơ</a></li>
            </ul>
            <div class="navbar-actions">
                <div class="language-switcher" aria-label="Language switcher">
                    <button type="button" class="lang-btn" data-lang-btn="vi">VI</button>
                    <button type="button" class="lang-btn" data-lang-btn="en">EN</button>
                </div>
                <div class="navbar-user">
                    <div class="user-avatar" id="userAvatar">A</div>
                    <button class="btn btn-outline btn-small" onclick="AuthService.logout()" data-i18n="common_logout">Đăng xuất</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <div class="profile-stack">
                <a href="/projects" class="btn btn-outline btn-small" data-i18n="project_edit_back">Quay lại danh sách</a>

                <section class="page-panel">
                    <div class="section-header">
                        <div>
                            <div class="hero-badge" data-i18n="project_edit_badge">Cập nhật dự án</div>
                            <h1 class="section-title" data-i18n="project_edit_header">Chỉnh sửa thông tin dự án</h1>
                            <p class="section-subtitle" data-i18n="project_edit_copy">Form được sắp xếp gọn, để người dùng sửa tên, mô tả và trạng thái mà không bị rối mắt.</p>
                        </div>
                    </div>

                    <form id="editForm" onsubmit="handleSubmit(event)">
                        <div class="form-group">
                            <label for="name" data-i18n="project_edit_name">Tên dự án</label>
                            <input type="text" id="name" name="name" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="description" data-i18n="project_edit_description">Mô tả</label>
                            <textarea id="description" name="description" class="form-control"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="partnersInput" data-i18n="project_edit_partners">Partner thực hiện</label>
                            <textarea id="partnersInput" name="partnersInput" class="form-control" rows="3" data-i18n-placeholder="project_edit_partners_placeholder" placeholder="Nhập username hoặc email, mỗi người một dòng"></textarea>
                            <small data-i18n="project_edit_partners_hint">Có thể thêm nhiều partner bằng cách xuống dòng hoặc dùng dấu phẩy.</small>
                        </div>

                        <div class="form-group">
                            <label for="active">
                                <input type="checkbox" id="active" name="active" checked>
                                <span data-i18n="project_edit_active">Kích hoạt dự án</span>
                            </label>
                        </div>

                        <div class="card-actions">
                            <a href="/projects" class="btn btn-secondary" data-i18n="project_edit_cancel">Hủy</a>
                            <button type="submit" class="btn btn-primary" data-i18n="project_edit_save">Lưu thay đổi</button>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.querySelectorAll('[data-lang-btn]').forEach((button) => {
            button.addEventListener('click', () => I18nService.setLanguage(button.dataset.langBtn));
        });

        const user = AuthService.getCurrentUser();
        if (user) {
            document.getElementById('userAvatar').textContent = (user.displayName || user.username).charAt(0).toUpperCase();
        }

        const projectId = window.location.pathname.split('/')[2];

        async function loadProject() {
            try {
                const project = await ProjectService.getById(projectId);
                document.getElementById('name').value = project.name;
                document.getElementById('description').value = project.description || '';
                document.getElementById('active').checked = project.active;
            } catch (error) {
                UIUtils.showError(I18nService.t('project_edit_load_error'));
                console.error('Error:', error);
            }
        }

        async function handleSubmit(e) {
            e.preventDefault();

            const partnerIdentifiers = [...new Set(
                document.getElementById('partnersInput').value
                    .split(/[\n,]/)
                    .map(value => value.trim())
                    .filter(Boolean)
            )];

            const data = {
                name: document.getElementById('name').value,
                description: document.getElementById('description').value,
                active: document.getElementById('active').checked
            };

            try {
                await ProjectService.update(projectId, data);
                for (const identifier of partnerIdentifiers) {
                    await ProjectService.addMember(projectId, identifier);
                }
                UIUtils.showSuccess(I18nService.t('project_edit_success'));
                setTimeout(() => {
                    window.location.href = '/projects';
                }, 1500);
            } catch (error) {
                UIUtils.showError(error.message || I18nService.t('project_edit_error'));
                console.error('Error:', error);
            }
        }

        loadProject();
    </script>
</body>
</html>
