<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinh Sua Du An - Jolliebee</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/dashboard" class="navbar-brand">Jolliebee</a>
            <ul class="navbar-menu">
                <li><a href="/dashboard" class="navbar-link">Dashboard</a></li>
                <li><a href="/projects" class="navbar-link active">Du an</a></li>
                <li><a href="/issues" class="navbar-link">Issues</a></li>
                <li><a href="/profile" class="navbar-link">Ho so</a></li>
            </ul>
            <div class="navbar-user">
                <div class="user-avatar" id="userAvatar">A</div>
                <button class="btn btn-outline btn-small" onclick="AuthService.logout()">Dang xuat</button>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <div class="profile-stack">
                <a href="/projects" class="btn btn-outline btn-small">Quay lai danh sach</a>

                <section class="page-panel">
                    <div class="section-header">
                        <div>
                            <div class="hero-badge">Cap nhat du an</div>
                            <h1 class="section-title">Chinh sua thong tin du an</h1>
                            <p class="section-subtitle">Form duoc sap xep gon, de user sua ten, mo ta va trang thai ma khong bi roi mat.</p>
                        </div>
                    </div>

                    <form id="editForm" onsubmit="handleSubmit(event)">
                        <div class="form-group">
                            <label for="name">Ten du an</label>
                            <input type="text" id="name" name="name" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="description">Mo ta</label>
                            <textarea id="description" name="description" class="form-control"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="active">
                                <input type="checkbox" id="active" name="active" checked>
                                Kich hoat du an
                            </label>
                        </div>

                        <div class="card-actions">
                            <a href="/projects" class="btn btn-secondary">Huy</a>
                            <button type="submit" class="btn btn-primary">Luu thay doi</button>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        const user = AuthService.getCurrentUser();
        if (user) {
            document.getElementById('userAvatar').textContent = (user.displayName || user.username).charAt(0).toUpperCase();
        }

        const projectId = window.location.pathname.split('/')[2];

        async function loadProject() {
            try {
                const project = await ProjectService.getById(projectId);
                document.getElementById('name').value = project.name;
                document.getElementById('description').value = project.description || '';
                document.getElementById('active').checked = project.active;
            } catch (error) {
                UIUtils.showError('Loi khi tai du an');
                console.error('Error:', error);
            }
        }

        async function handleSubmit(e) {
            e.preventDefault();

            const data = {
                name: document.getElementById('name').value,
                description: document.getElementById('description').value,
                active: document.getElementById('active').checked
            };

            try {
                await ProjectService.update(projectId, data);
                UIUtils.showSuccess('Du an duoc cap nhat thanh cong');
                setTimeout(() => {
                    window.location.href = '/projects';
                }, 1500);
            } catch (error) {
                UIUtils.showError('Loi khi cap nhat du an');
                console.error('Error:', error);
            }
        }

        loadProject();
    </script>
</body>
</html>
