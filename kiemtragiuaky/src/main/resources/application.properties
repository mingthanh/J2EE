spring.datasource.url=jdbc:mysql://localhost:3306/course_db
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false
server.port=8080

# OAuth2 Google (fill in your credentials)
spring.security.oauth2.client.registration.google.client-id= your_ID
spring.security.oauth2.client.registration.google.client-secret= your_SecretKey
spring.security.oauth2.client.registration.google.scope=openid,profile,email
