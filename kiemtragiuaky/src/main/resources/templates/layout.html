<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} ?: 'Course Registration'">Course Registration</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:fragment="layout(content)">
    <div class="navbar">
        <div class="container navbar-inner">
            <div class="brand">Course Registration</div>
            <form class="search" th:action="@{/home}" method="get">
                <input type="text" name="q" placeholder="Search courses..." th:value="${q}">
                <button type="submit" class="btn">Search</button>
            </form>
            <div class="nav-links">
                <a th:href="@{/home}">Home</a>
                <a sec:authorize="hasRole('STUDENT')" th:href="@{/my-courses}">My Courses</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/courses}">Admin</a>
                <a sec:authorize="isAnonymous()" th:href="@{/login}">Login</a>
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn-link">Logout</button>
                </form>
            </div>
        </div>
    </div>
    <main class="container">
        <section th:replace="${content}"></section>
    </main>
    <div class="page-footer">
        Course Registration System
    </div>
 </div>
</body>
</html>
