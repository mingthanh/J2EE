<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Courses</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{layout :: layout(~{::section})}">
    <section>
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Manage Courses</h2>
            <a class="btn" th:href="@{/admin/courses/create}">Create Course</a>
        </div>
        <table class="table">
            <thead>
            <tr>
                <th>Name</th>
                <th>Credits</th>
                <th>Lecturer</th>
                <th>Category</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="course : ${courses.content}">
                <td th:text="${course.name}">Name</td>
                <td th:text="${course.credits}">0</td>
                <td th:text="${course.lecturer}">Lecturer</td>
                <td th:text="${course.category != null ? course.category.name : 'N/A'}">Category</td>
                <td>
                    <a class="btn-outline" th:href="@{/admin/courses/edit/{id}(id=${course.id})}">Edit</a>
                    <form th:action="@{/admin/courses/delete/{id}(id=${course.id})}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn-secondary">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="pagination" th:if="${courses.totalPages > 1}">
            <a th:if="${courses.hasPrevious()}"
               th:href="@{/admin/courses(page=${courses.number - 1})}" class="btn-outline">Previous</a>
            <span>Page <span th:text="${courses.number + 1}">1</span> / <span th:text="${courses.totalPages}">1</span></span>
            <a th:if="${courses.hasNext()}"
               th:href="@{/admin/courses(page=${courses.number + 1})}" class="btn-outline">Next</a>
        </div>
    </section>
</div>
</body>
</html>
